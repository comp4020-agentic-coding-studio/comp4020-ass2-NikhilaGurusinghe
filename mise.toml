[tools]
# Node stays alongside Bun, but only as the framework's runtime: `next build`
# segfaults under `bunx --bun`, so Next runs on Node, and the Pagefind CLI is a
# Node package. Everything this repo owns — scripts/, spec/, the test runner,
# the package manager — is Bun. If you are adding a script, it goes on Bun.
node = "24"
bun = "1.3.14"
