name: checks

on:
  push:
    branches: [main]
  pull_request:
  # /ship dispatches a run after flipping the repo public, since the
  # visibility flip itself triggers no push event.
  workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    # Jobs only run once the repo is public: private-phase pushes would drain
    # the org's shared free Actions pool, and `bun run check` runs the same
    # sensors locally while you build (public repos get unlimited minutes, so
    # cost ends at the flip).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the secret scan can see all commits
      # Both runtimes, for the reason mise.toml gives: Bun is the package
      # manager, the script runner and the test runner, but Node is what
      # actually executes Next — `bunx --bun next build` segfaults. Everything
      # in scripts/ and spec/ runs on Bun; Node is here for the framework only.
      - uses: oven-sh/setup-bun@v2
        with:
          # Same number as mise.toml and package.json's packageManager field.
          # Three copies, because neither of those is a thing this action can
          # read; if you bump one, bump all three.
          bun-version: "1.3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Cache Bun's global module cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Build and run the spec
        run: bun run check
      - name: Test template tooling
        # These tests protect starter internals, not decisions students make.
        if: ${{ github.event.repository.is_template }}
        run: bun run test:template
      - name: Check the process evidence
        # skipped in the template repo itself, where PROCESS.md is still the
        # boilerplate every student replaces
        if: ${{ !github.event.repository.is_template }}
        run: bun run check:evidence
      - name: Scan for committed secrets
        # Pinned, both halves: the SHA fixes the action's script, and `version`
        # fixes the scanner image, which otherwise floats on :latest. These two
        # steps run in every repo in the course, so an upstream change would
        # break the whole cohort's CI in the same hour. Bump between semesters.
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          version: "3.96.0"
          extra_args: --only-verified
      - name: Scan for a committed course key
        # The scan above reports only secrets it can confirm are live, and a
        # course key has no verifier a runner can reach --- see
        # .github/trufflehog.yml, which matches its shape instead.
        # CustomRegex scopes this pass to that file's detector, so the built-in
        # ones don't add unverified noise on top of it.
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          version: "3.96.0"
          extra_args: >-
            --config=.github/trufflehog.yml
            --include-detectors=CustomRegex --results=unverified
            --no-verification

  deploy:
    # Deliberately not `needs: check`. The checks in `spec/` are the student's
    # own work and are marked as such, so a red one is a finding about the
    # course they are building --- not a reason to take their live site down
    # mid-assignment. The deploy runs its own `bun run build`, which is the
    # gate that matters here: a site that cannot build still cannot ship.
    #
    # Pages can't serve a private repo on the free org anyway; the visibility
    # condition keeps a private-phase run from failing confusingly here.
    if: ${{ !github.event.repository.private && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Cache Bun's global module cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      # GITHUB_REPOSITORY is set by Actions, so lib/base-path.ts resolves the
      # /<repo> sub-path from it rather than from the git remote. The build's
      # own link gate then checks every URL carries that prefix, which is the
      # failure this deployment shape invites.
      - run: bun run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
      - id: deploy
        uses: actions/deploy-pages@v5
      - name: Verify the deployed site is online
        run: |
          url="${{ steps.deploy.outputs.page_url }}"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url" || true)
            if [ "$code" = "200" ]; then echo "online: $url"; exit 0; fi
            echo "attempt $i: HTTP $code, retrying in 10s..."
            sleep 10
          done
          echo "site did not return 200"; exit 1
